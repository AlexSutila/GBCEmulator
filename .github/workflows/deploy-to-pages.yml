name: Build & Deploy WASM

on:
  push:
    branches:
      - release

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake make ninja-build python3 \
            rsync openssh-client
          update-ca-certificates

      - name: Set up Emscripten SDK
        uses: https://github.com/mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure (emcmake)
        run: |
          mkdir -p build
          cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build (emmake)
        run: |
          cd build
          emmake make -j"$(nproc)"

      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist
          # Adjust to fit actual output:
          cp -a build/*.html build/*.js build/*.wasm build/*.data build/*.css dist/ 2>/dev/null || true
          # If there are asset folders:
          cp -a build/assets dist/assets 2>/dev/null || true

      - name: Deploy to server (rsync over SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"