name: Build & Deploy WASM to GitHub Pages

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure (emcmake)
        run: |
          mkdir -p build
          cd build
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (emmake)
        run: |
          cd build
          emmake make -j$(nproc)

      - name: Prepare Pages output
        run: |
          mkdir -p dist
          cp -r build/* dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
