name: mooneye_tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libjack-dev \
            libsndio-dev \
            libsamplerate0-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libudev-dev
          python3 -m pip install --upgrade pip
          pip install pytest pytest-md-report

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build gbc_py
        run: |
          cd build
          make gbc_py -j6

      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          pytest_verbosity: 2
        run: |
          PYTHONPATH=build pytest testing/test_mooneye.py --md-report \
            --md-report-verbose=2 \
            --md-report-output "mooneye-coverage.md"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mooneye-coverage
          path: mooneye-coverage.md
