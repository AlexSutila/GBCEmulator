<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <title>GBC Emulator</title>

  <style>
    :root {
      --bg0: #070a0f;
      --bg1: #0b1020;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.10);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.68);
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      --radius: 18px;
      --touchbar-h: 0px; /* overridden on touch */
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(1200px 700px at 50% -20%, rgba(99, 102, 241, 0.24), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(34, 211, 238, 0.10), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg0));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      height: 100vh; /* fallback */
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      padding: 14px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand .title {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.06));
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: 0.15px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.05s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn.primary {
      border-color: rgba(99, 102, 241, 0.55);
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.40), rgba(99, 102, 241, 0.18));
    }

    .btn.disabled {
      opacity: 0.6;
      cursor: default;
      pointer-events: none;
    }

    #romInput {
      display: none;
    }

    .stage {
      padding: 0 14px calc(14px + var(--touchbar-h));
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .canvas-card {
      width: min(92vw, 860px);
      height: min(calc(100dvh - 120px - var(--touchbar-h)), 92vw);
      max-height: 900px;
      aspect-ratio: 10 / 9;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: calc(var(--radius) - 10px);
      image-rendering: pixelated;
      background: #000;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      max-width: min(92vw, 860px);
      line-height: 1.35;
    }

    .hint code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(0, 0, 0, 0.22);
    }

    /* Touch controls (phones/tablets) */
    #touch-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      display: none;
      gap: 12px;
      align-items: end;
      justify-content: space-between;
      pointer-events: none; /* enable only on children */
    }

    #touch-controls .cluster {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.40);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .dpad {
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 8px;
      align-items: center;
      justify-items: center;
    }

    .dpad .spacer {
      width: 56px;
      height: 56px;
    }

    .touch-btn {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
      color: var(--text);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      font-weight: 750;
    }

    .touch-btn:active {
      transform: translateY(1px);
    }

    .touch-btn.square {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 1.05rem;
    }

    .touch-btn.pill {
      height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      letter-spacing: 0.2px;
    }

    .touch-btn.round {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      font-size: 1.25rem;
    }

    .touch-btn.round.b {
      width: 64px;
      height: 64px;
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .meta {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .ab {
      display: flex;
      gap: 12px;
      align-items: end;
      justify-content: center;
    }

    .dlg {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(12,16,28,.96);
      color: rgba(255,255,255,.92);
      padding: 14px;
      width: min(92vw, 560px);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
    }

    .dlg::backdrop {
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .dlg-form { display: grid; gap: 12px; margin: 0; }
    .dlg-title { font-weight: 800; letter-spacing: .2px; }
    .dlg-sub { color: var(--muted); font-size: .92rem; }

    .dlg-section { display: grid; gap: 8px; }
    .dlg-label { font-weight: 700; font-size: .92rem; color: rgba(255,255,255,.88); }
    .dlg-help { color: var(--muted); font-size: .88rem; line-height: 1.35; }
    .dlg-help code { padding: 1px 6px; border-radius: 999px; border: 1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.22); }

    .dlg-divider {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.55);
      font-size: .85rem;
      padding: 2px 0;
    }

    .dlg-file,
    .dlg-url {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      outline: none;
    }

    .dlg-urlrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }

    .dlg-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 0;
      margin: 0;
    }

    .rom-list {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      border-radius: 14px;
      padding: 8px;
      margin: 0;
      max-height: min(46vh, 360px);
      overflow: auto;
      display: grid;
      gap: 6px;
    }

    .rom-item {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.12);
      cursor: pointer;
    }

    .rom-item:hover { border-color: rgba(255,255,255,.18); }

    .rom-item input[type="radio"] { margin: 0; }
    .rom-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rom-size { color: var(--muted); font-size: .88rem; }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-chip {
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.88);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: .86rem;
      cursor: pointer;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .recent-chip:hover { border-color: rgba(255,255,255,.20); }

    .recent-chip .txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 44ch;
    }

    .recent-chip .hint {
      color: rgba(255,255,255,.55);
      font-size: .82rem;
    }

    @media (pointer: coarse), (max-width: 900px) {
      :root {
        --touchbar-h: 190px;
      }

      #touch-controls {
        display: flex;
      }

      .hint.desktop-only {
        display: none;
      }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="title" id="title">GBC Emulator</div>
      <div class="subtitle" id="status">Load a ROM to begin</div>
    </div>

  <div class="actions">
    <button class="btn primary" id="loadButton" type="button">Load ROM...</button>
    <button class="btn" id="fsButton" type="button">Fullscreen</button>
  </div>
  </header>

  <main class="stage">
    <div>
      <div class="canvas-card" id="canvasCard">
        <canvas id="canvas"></canvas>
      </div>
      <div class="hint desktop-only" id="hint">
        Keyboard: <code>Arrows</code> <code>Z</code>=A <code>X</code>=B <code>Enter</code>=Start <code>Backspace</code>=Select
      </div>
    </div>
  </main>

  <div aria-label="On-screen controller" id="touch-controls">
    <div class="cluster">
      <div aria-label="D-pad" class="dpad">
        <div class="spacer"></div>
        <button aria-label="Up" class="touch-btn square" data-btn="2">▲</button>
        <div class="spacer"></div>

        <button aria-label="Left" class="touch-btn square" data-btn="1">◀</button>
        <div class="spacer"></div>
        <button aria-label="Right" class="touch-btn square" data-btn="0">▶</button>

        <div class="spacer"></div>
        <button aria-label="Down" class="touch-btn square" data-btn="3">▼</button>
        <div class="spacer"></div>
      </div>
    </div>

    <div class="cluster">
      <div aria-label="Start/Select" class="meta">
        <button aria-label="Select" class="touch-btn pill" data-btn="6">Select</button>
        <button aria-label="Start" class="touch-btn pill" data-btn="7">Start</button>
      </div>
    </div>

    <div class="cluster">
      <div aria-label="A/B" class="ab">
        <button aria-label="B" class="touch-btn round b" data-btn="5">B</button>
        <button aria-label="A" class="touch-btn round" data-btn="4">A</button>
      </div>
    </div>
  </div>
</div>

<dialog id="loadDialog" class="dlg">
  <form method="dialog" class="dlg-form" id="loadDialogForm">
    <div class="dlg-title">Load ROM</div>

    <div class="dlg-section">
      <div class="dlg-label">Local file</div>
      <input id="loadFileInput" type="file" accept=".gb,.gbc,.zip" class="dlg-file"/>
      <div class="dlg-help">Accepts <code>.gb</code>, <code>.gbc</code>, or <code>.zip</code></div>
    </div>

    <div class="dlg-divider">or</div>

    <div class="dlg-section">
      <div class="dlg-label">URL</div>
      <div class="dlg-urlrow">
        <input id="loadUrlInput" type="url" inputmode="url" placeholder="https://example.com/game.zip"
               autocomplete="off" spellcheck="false" class="dlg-url"/>
        <button id="loadUrlGo" class="btn primary" type="button">Load</button>
      </div>
      <div class="dlg-help">Remote hosting must allow CORS.</div>
    </div>

    <div class="dlg-section" id="recentWrap" style="display:none;">
      <div class="dlg-label" style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <span>Recent</span>
        <button id="recentClear" class="btn" type="button" style="padding:8px 10px; border-radius:10px; font-size:.86rem;">Clear</button>
      </div>
      <div class="recent-list" id="recentList" aria-label="Recent URLs"></div>
    </div>

    <menu class="dlg-actions">
      <button class="btn" value="cancel">Close</button>
    </menu>
  </form>
</dialog>

<dialog id="romPicker" class="dlg">
  <form method="dialog" class="dlg-form" id="romPickerForm">
    <div class="dlg-title">Choose a ROM</div>
    <div class="dlg-sub" id="romPickerCount"></div>

    <fieldset class="rom-list" id="romList" aria-label="ROM list">
      <!-- radios injected here -->
    </fieldset>

    <menu class="dlg-actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="ok" id="romPickerOk">Load</button>
    </menu>
  </form>
</dialog>

<script>
  function isTouchDevice() {
    return window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(max-width: 900px)").matches;
  }

  function setupCanvasFocus(canvas) {
    canvas.tabIndex = 0;
    canvas.focus();

    window.addEventListener(
      "keydown",
      (e) => {
        const block = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "Backspace"]);
        if (block.has(e.code)) e.preventDefault();
      },
      { passive: false }
    );

    window.addEventListener("pointerdown", () => canvas.focus());
  }

  function bindTouchButtons(Module) {
    const callSetBtn = (btn, pressed) => {
      if (typeof Module._emscripten_set_button === "function") {
        Module._emscripten_set_button(btn, pressed ? 1 : 0);
      }
    };

    const clearAll = () => {
      if (typeof Module._emscripten_clear_buttons === "function") {
        Module._emscripten_clear_buttons();
      }
    };

    const buttons = document.querySelectorAll("[data-btn]");
    for (const el of buttons) {
      const btn = Number(el.dataset.btn);

      const down = (e) => {
        e.preventDefault();
        el.setPointerCapture?.(e.pointerId);
        callSetBtn(btn, true);
      };

      const up = (e) => {
        e.preventDefault();
        callSetBtn(btn, false);
      };

      el.addEventListener("pointerdown", down, { passive: false });
      el.addEventListener("pointerup", up, { passive: false });
      el.addEventListener("pointercancel", up, { passive: false });
      el.addEventListener("contextmenu", (e) => e.preventDefault());
    }

    window.addEventListener("blur", clearAll);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) clearAll();
    });

    return { clearAll };
  }

  function setupFullscreen(canvas) {
    const btn = document.getElementById("fsButton");
    const card = document.getElementById("canvasCard");

    const request = async () => {
      try {
        if (!document.fullscreenElement) {
          await (card.requestFullscreen?.() || canvas.requestFullscreen?.());
        } else {
          await document.exitFullscreen?.();
        }
      } catch (err) {
        console.warn("Fullscreen failed:", err);
      }
    };

    btn.addEventListener("click", request);
    document.addEventListener("fullscreenchange", () => {
      btn.textContent = document.fullscreenElement ? "Exit" : "Fullscreen";
    });
  }

  // ---- Added helpers: remote fetch + zip unzip + ROM picking ----

  const ROM_RE = /\.(gb|gbc)$/i;
  const ZIP_RE = /\.zip$/i;

  function basename(path) {
    const s = String(path).replace(/\\/g, "/");
    const parts = s.split("/");
    return parts[parts.length - 1] || s;
  }

  function prettyBytes(n) {
    if (!Number.isFinite(n)) return "";
    const units = ["B", "KB", "MB", "GB"];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
  }

  function guessNameFromUrl(u) {
    try {
      const url = new URL(u, window.location.href);
      const name = decodeURIComponent(url.pathname.split("/").pop() || "");
      return name || "remote";
    } catch {
      return "remote";
    }
  }

  async function ensureFflateLoaded() {
    if (window.fflate?.unzip) return;

    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/fflate/umd/index.js";
      s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed to load unzip library (fflate)."));
      document.head.appendChild(s);
    });

    if (!window.fflate?.unzip) {
      throw new Error("Unzip library loaded, but API missing.");
    }
  }

  function pickRomFromMany(entries) {
    const dlg = document.getElementById("romPicker");
    const supportsDialog = !!dlg?.showModal;

    // Default to largest file
    let defaultIdx = 0;
    for (let i = 1; i < entries.length; i++) {
      if (entries[i].size > entries[defaultIdx].size) defaultIdx = i;
    }

    if (!supportsDialog) {
      const list = entries.map((e, i) => `${i}: ${e.name} (${prettyBytes(e.size)})`).join("\n");
      const ans = window.prompt(`Multiple ROMs found.\n\n${list}\n\nEnter the number to load:`, String(defaultIdx));
      if (ans == null) throw new Error("Cancelled.");
      const idx = Number(ans);
      if (!Number.isInteger(idx) || idx < 0 || idx >= entries.length) throw new Error("Invalid selection.");
      return Promise.resolve(entries[idx]);
    }

    const listEl = document.getElementById("romList");
    const countEl = document.getElementById("romPickerCount");

    countEl.textContent = `${entries.length} ROMs found`;
    listEl.innerHTML = "";

    entries.forEach((e, i) => {
      const id = `romradio_${i}`;
      const label = document.createElement("label");
      label.className = "rom-item";
      label.htmlFor = id;

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "rompick";
      radio.value = String(i);
      radio.id = id;
      radio.checked = (i === defaultIdx);

      const name = document.createElement("div");
      name.className = "rom-name";
      name.textContent = e.name;

      const size = document.createElement("div");
      size.className = "rom-size";
      size.textContent = prettyBytes(e.size);

      label.appendChild(radio);
      label.appendChild(name);
      label.appendChild(size);

      // double-click / double-tap loads immediately
      label.addEventListener("dblclick", () => {
        dlg.returnValue = "ok";
        dlg.close();
      });

      listEl.appendChild(label);
    });

    dlg.showModal();

    return new Promise((resolve, reject) => {
      dlg.addEventListener("close", () => {
        if (dlg.returnValue === "cancel") return reject(new Error("Cancelled."));
        const chosen = dlg.querySelector('input[name="rompick"]:checked');
        const idx = Number(chosen?.value ?? defaultIdx);
        resolve(entries[idx]);
      }, { once: true });
    });
  }

  async function unzipAndSelectRom(zipBytes) {
    await ensureFflateLoaded();

    const files = await new Promise((resolve, reject) => {
      window.fflate.unzip(zipBytes, (err, out) => {
        if (err) reject(err);
        else resolve(out);
      });
    });

    const roms = [];
    for (const [path, bytes] of Object.entries(files)) {
      if (!bytes || !bytes.length) continue;
      if (path.endsWith("/")) continue;
      if (!ROM_RE.test(path)) continue;
      roms.push({ name: basename(path), bytes, size: bytes.length });
    }

    if (roms.length === 0) {
      throw new Error("No .gb/.gbc files found in the ZIP.");
    }
    if (roms.length === 1) return roms[0];
    return await pickRomFromMany(roms);
  }

  function isEmscriptenUnwind(e) {
    // Emscripten can throw either a string or an Error-ish object
    if (e === "unwind") return true;
    const msg = (e && (e.message || e.toString?.())) ? String(e.message || e.toString()) : String(e);
    return msg.toLowerCase().includes("unwind");
  }

  function closeDialogSafe(id) {
    const dlg = document.getElementById(id);
    try {
      if (dlg?.open) dlg.close();
    } catch {}
  }

  const RECENT_KEY = "gbc_recent_rom_urls_v1";
  const RECENT_MAX = 8;

  function loadRecentUrls() {
    try {
      const arr = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      return Array.isArray(arr) ? arr.filter((s) => typeof s === "string") : [];
    } catch {
      return [];
    }
  }

  function saveRecentUrls(urls) {
    try {
      localStorage.setItem(RECENT_KEY, JSON.stringify(urls.slice(0, RECENT_MAX)));
    } catch {}
  }

  function addRecentUrl(url) {
    const u = String(url || "").trim();
    if (!u) return;
    const urls = loadRecentUrls();
    const next = [u, ...urls.filter((x) => x !== u)];
    saveRecentUrls(next);
  }

  function renderRecentUrls({ onPick }) {
    const wrap = document.getElementById("recentWrap");
    const list = document.getElementById("recentList");
    if (!wrap || !list) return;

    const urls = loadRecentUrls();
    if (!urls.length) {
      wrap.style.display = "none";
      list.innerHTML = "";
      return;
    }

    wrap.style.display = "grid";
    list.innerHTML = "";

    for (const u of urls) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "recent-chip";

      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = u;

      btn.appendChild(txt);

      btn.addEventListener("click", () => onPick?.(u));
      btn.addEventListener("dblclick", () => onPick?.(u, { load: true }));

      list.appendChild(btn);
    }
  }

  function looksLikeHttpUrl(s) {
    try {
      const u = new URL(s);
      return u.protocol === "http:" || u.protocol === "https:";
    } catch {
      return false;
    }
  }

  // ---- Emscripten module ----

  var Module = {
    canvas: document.getElementById("canvas"),

    printErr(text) {
      console.error(text);
    },

    onRuntimeInitialized() {
      const canvas = Module.canvas;
      const loadButton = document.getElementById("loadButton");
      const loadDlg = document.getElementById("loadDialog");
      const loadFileInput = document.getElementById("loadFileInput");
      const loadUrlInput = document.getElementById("loadUrlInput");
      const loadUrlGo = document.getElementById("loadUrlGo");
      const recentClear = document.getElementById("recentClear");
      const status = document.getElementById("status");

      setupCanvasFocus(canvas);
      setupFullscreen(canvas);
      const touch = bindTouchButtons(Module);

      const setTempDisabled = (disabled) => {
        loadButton.disabled = disabled;
        loadButton.classList.toggle("disabled", disabled);
        loadFileInput.disabled = disabled;
        loadUrlInput.disabled = disabled;
        loadUrlGo.disabled = disabled;
      };

      const setLoadedUI = (fileName) => {
        setTempDisabled(true);
        loadButton.textContent = "Loaded";
        status.textContent = fileName ? fileName : "Running";
      };

      const loadRomBytes = async (bytes, nameForUi) => {
        touch.clearAll();
        setLoadedUI(nameForUi);
        FS.writeFile("/rom.bin", bytes);

        // Close any UI dialogs BEFORE entering wasm (prevents "unwind" from skipping close)
        closeDialogSafe("romPicker");
        closeDialogSafe("loadDialog");

        // Start on next tick so the close renders first
        setTimeout(() => {
          try {
            Module._emscripten_start();
          } catch (e) {
            // Ignore Emscripten's internal unwind signal
            if (isEmscriptenUnwind(e)) return;
            throw e;
          }
        }, 0);
      };
      const handleBlobOrFile = async (blob, displayName) => {
        const name = displayName || blob?.name || "file";
        const bytes = new Uint8Array(await blob.arrayBuffer());

        if (ZIP_RE.test(name)) {
          status.textContent = "Unzipping…";
          const picked = await unzipAndSelectRom(bytes);
          await loadRomBytes(picked.bytes, picked.name);
          return;
        }

        if (ROM_RE.test(name)) {
          await loadRomBytes(bytes, name);
          return;
        }

        throw new Error("Unsupported file type. Use .gb, .gbc, or .zip");
      };

      const fetchRemote = async (url) => {
        const name = guessNameFromUrl(url);
        status.textContent = "Downloading…";

        // NOTE: Remote hosting must allow CORS for this to work.
        const resp = await fetch(url, { mode: "cors" });
        if (!resp.ok) throw new Error(`Download failed: HTTP ${resp.status}`);

        const ab = await resp.arrayBuffer();
        const bytes = new Uint8Array(ab);

        // Zip detection: by extension OR content-type
        const ct = resp.headers.get("content-type") || "";
        const looksZip = ZIP_RE.test(name) || ct.includes("zip");

        if (looksZip) {
          status.textContent = "Unzipping…";
          const picked = await unzipAndSelectRom(bytes);
          addRecentUrl(url);
          await loadRomBytes(picked.bytes, picked.name);
          return;
        }

        if (ROM_RE.test(name)) {
          addRecentUrl(url);
          await loadRomBytes(bytes, name);
          return;
        }

        throw new Error("Remote file must be .gb/.gbc or .zip");
      };

      loadButton.addEventListener("click", () => {
        if (loadButton.disabled) return;
        loadFileInput.value = "";
        loadUrlInput.value = "";

        renderRecentUrls({
          onPick: (u, opts) => {
            loadUrlInput.value = u;
            loadUrlInput.focus();
            if (opts?.load) loadUrlGo.click();
          }
        });

        loadDlg.showModal?.();
        setTimeout(() => loadUrlInput.focus(), 0);
      });

      recentClear?.addEventListener("click", () => {
        saveRecentUrls([]);
        renderRecentUrls({ onPick: (u) => { loadUrlInput.value = u; loadUrlInput.focus(); } });
      });

      // Load local file immediately when selected
      loadFileInput.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        try {
          setTempDisabled(true);
          status.textContent = "Loading…";
          await handleBlobOrFile(file, file.name);
        } catch (err) {
          console.warn(err);
          status.textContent = (err && err.message) ? err.message : "Failed to load file";
          setTempDisabled(false);
        }
      });

      // Load URL when pressing the dialog Load button
      loadUrlGo.addEventListener("click", async () => {
        const url = (loadUrlInput.value || "").trim();
        if (!url) return;

        try {
          setTempDisabled(true);
          await fetchRemote(url);
        } catch (err) {
          console.warn(err);
          status.textContent = (err && err.message) ? err.message : "Failed to load URL";
          setTempDisabled(false);
        }
      });

      // Enter key in URL box triggers Load
      loadUrlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          loadUrlGo.click();
        }
      });

      // Drag/drop: accept .gb/.gbc/.zip
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("drop", async (e) => {
        e.preventDefault();
        if (!e.dataTransfer?.files?.length || loadButton.disabled) return;

        const file = e.dataTransfer.files[0];
        if (!file) return;

        if (!ROM_RE.test(file.name) && !ZIP_RE.test(file.name)) return;

        try {
          setTempDisabled(true);
          await handleBlobOrFile(file, file.name);
        } catch (err) {
          console.warn(err);
          status.textContent = (err && err.message) ? err.message : "Failed to load file";
          setTempDisabled(false);
        }
      });

      // Optional: auto-load via ?rom=URL
      try {
        const params = new URLSearchParams(window.location.search);
        const auto = params.get("rom");
        if (auto) {
          (async () => {
            try {
              setTempDisabled(true);
              await fetchRemote(auto);
            } catch (err) {
              console.warn(err);
              status.textContent = (err && err.message) ? err.message : "Failed to auto-load URL";
              setTempDisabled(false);
            }
          })();
        }
      } catch {}

      if (isTouchDevice()) {
        status.textContent = "Tap Load File / Load URL (or drop a file)";
      }
    }
  };
</script>
